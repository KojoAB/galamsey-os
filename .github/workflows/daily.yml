name: Daily operations
# 05:00 GMT detection, 07:00 GMT alerts, Mondays 07:10 GMT weekly digest.
# GitHub may start scheduled jobs a few minutes late.
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
    - cron: "10 7 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "detect | notify | weekly | connectors"
        default: detect

concurrency: { group: daily-${{ github.event.schedule || github.event.inputs.job }}, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults: { run: { working-directory: pipeline } }
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: ${{ vars.APP_URL }}
      GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      GEE_PROJECT: ${{ vars.GEE_PROJECT }}
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
      NOTIFY_DRY_RUN: ${{ vars.NOTIFY_DRY_RUN || '1' }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_ALERT_TEMPLATE: ${{ vars.WHATSAPP_ALERT_TEMPLATE }}
      SMS_PROVIDER: ${{ vars.SMS_PROVIDER }}
      AT_USERNAME: ${{ secrets.AT_USERNAME }}
      AT_API_KEY: ${{ secrets.AT_API_KEY }}
      AT_SENDER_ID: ${{ vars.AT_SENDER_ID }}
      HUBTEL_CLIENT_ID: ${{ secrets.HUBTEL_CLIENT_ID }}
      HUBTEL_CLIENT_SECRET: ${{ secrets.HUBTEL_CLIENT_SECRET }}
      HUBTEL_SENDER_ID: ${{ vars.HUBTEL_SENDER_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      AI_CLASSIFIER: ${{ vars.AI_CLASSIFIER || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pipeline/requirements*.txt }
      - run: pip install -r ${{ vars.AI_CLASSIFIER == '1' && 'requirements-ai.txt' || 'requirements.txt' }}
      - uses: actions/cache@v4
        if: vars.AI_CLASSIFIER == '1'
        with: { path: ~/.cache/galamsey-watch, key: model-v4.10b }
      - name: Pick job
        id: job
        run: |
          case "${{ github.event.schedule }}" in
            "0 5 * * *") echo "job=detect" >> "$GITHUB_OUTPUT" ;;
            "0 7 * * *") echo "job=notify" >> "$GITHUB_OUTPUT" ;;
            "10 7 * * 1") echo "job=weekly" >> "$GITHUB_OUTPUT" ;;
            *) echo "job=${{ github.event.inputs.job || 'detect' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: python -m galamsey.daily ${{ steps.job.outputs.job }}
